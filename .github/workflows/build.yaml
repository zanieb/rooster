name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    branches:
      - main

permissions: {}

jobs:
  build-and-publish:
    name: Publish test release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build-version: ${{ steps.build.outputs.version }}

    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'test-build')

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: Publish to Test PyPI
        id: build
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing] Retain TestPyPI token authentication for now.
          version=$(./scripts/version dev)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          uv version "$version"
          uv build
          uv publish --publish-url https://test.pypi.org/legacy/

  test-install:
    # We test the install on a clean machine to avoid poetry behavior attempting to
    # install the project root when it is checked out
    name: Test install
    runs-on: ubuntu-latest
    needs: build-and-publish
    timeout-minutes: 5
    env:
      BUILD_VERSION: ${{ needs.build-and-publish.outputs.build-version }}

    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Wait for package to be available
        run: >
          until
          curl --silent "https://test.pypi.org/simple/rooster-blue/"
          | grep --fixed-strings --quiet -- "$BUILD_VERSION";
          do sleep 10;
          done
          &&
          sleep 120
          # We sleep for an additional 120 seconds as it seems to take a bit longer for
          # the package to be consistently available

          # Note: The above will not sleep forever due to the job level timeout

      - name: Install release from Test PyPI
        run: |
          uv venv -p 3.14
          uv pip install --index-strategy unsafe-best-match --refresh-package rooster-blue --extra-index-url https://test.pypi.org/simple/ "rooster-blue==$BUILD_VERSION"

      - name: Check release version
        run: |
          installed=$(uv run python -c "from importlib.metadata import version; print(version('rooster-blue'))")
          test "$installed" = "$BUILD_VERSION"

      - name: Check CLI help
        run: |
          uv run -- rooster --help
