name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    branches:
      - main

permissions: {}

jobs:
  build-and-publish:
    name: Publish test release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build-version: ${{ steps.build.outputs.version }}

    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'test-build')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Publish to Test PyPI
        id: build
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing] Retain TestPyPI token authentication for now.
          version=$(./scripts/version dev)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          uv version "$version"
          uv build
          uv publish --publish-url https://test.pypi.org/legacy/

  # Use a separate environment so installation exercises the published package.
  test-install:
    name: Test install
    runs-on: ubuntu-latest
    needs: build-and-publish
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUILD_VERSION: ${{ needs.build-and-publish.outputs.build-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      - name: Install libgit2 for Python 3.15 source builds
        run: bash scripts/install-libgit2 "$RUNNER_TEMP/libgit2"

      - name: Wait for package to be available
        run: >
          until
          curl --silent "https://test.pypi.org/simple/rooster/"
          | grep --fixed-strings --quiet -- "$BUILD_VERSION";
          do sleep 10;
          done
          &&
          sleep 120
          # We sleep for an additional 120 seconds as it seems to take a bit longer for
          # the package to be consistently available

          # Note: The above will not sleep forever due to the job level timeout

      - name: Install release from Test PyPI
        run: |
          uv venv -p 3.15 "$RUNNER_TEMP/rooster-install"
          uv pip install --python "$RUNNER_TEMP/rooster-install/bin/python" --index-strategy unsafe-best-match --refresh-package rooster --extra-index-url https://test.pypi.org/simple/ "rooster==$BUILD_VERSION"

      - name: Check release version
        run: |
          installed=$("$RUNNER_TEMP/rooster-install/bin/python" -c "from importlib.metadata import version; print(version('rooster'))")
          test "$installed" = "$BUILD_VERSION"

      - name: Check CLI help
        run: |
          "$RUNNER_TEMP/rooster-install/bin/rooster" --help
